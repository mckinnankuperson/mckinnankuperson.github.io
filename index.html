<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mckinnan's Digital Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>

<header>
<h1>Mckinnan's Digital Hub</h1>
<nav>
<a href="#profile">Profile</a>
<a href="#books">Books</a>
<a href="#files">Files</a>
<a href="#media">Media Gallery</a>
</nav>
</header>

<section id="profile">
<h2>Profile</h2>
<img src="profile.jpg" alt="My Profile Photo" style="width:200px; board-radius:50%;">
<p>Welcome to my digital library website. I upload books, PDFs, images, and videos here.</p>
</section>

<section id="books">
<h2>Books</h2>
<ul>
<li><a href="files/books/sample-book.pdf">Download Sample Book</a></li>
</ul>
</section>

<section id="files">
<h2>PDF Files</h2>
<ul>
<li><a href="files/pdf/sample.pdf">Open Sample PDF</a></li>
</ul>
</section>

<section id="media-gallery">
<h2>Media Gallery</h2>

<div class="video-block">
  </h3>Welcome Video</h3>
  <video width="600" control>
    <source src="intro.mp4" type="video/mp4"
      </video>
</div>

  <div class="video-block">
    </h3>Lesson 1</h3>
    <video width="400" controls>
      <source src="lesson1.mp4" type="video/mp4">
      </video>
  </div>

  <div class="video-block">
    </h3>Lesson 2</h3>
    <video width="400" controls>
      <source src="lesson2.mp4" type="video/mp4">
    </video>
  </div>
</section>
  
<img src="assets/images/sample.jpg" class="media">

<video width="600" controls>
<source src="223.mp4" type="video/mp4">
</video>

</section>

<footer>
<p>© 2026 Mckinnan</p>
</footer>

<script src="script.js"></script>
</body>
</html>
